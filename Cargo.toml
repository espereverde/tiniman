[package]
name = "game_prototypes"
version = "0.1.0"
edition = "2021"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.11.3"}
bevy_asset_loader = {version = "*", features = ["2d", "standard_dynamic_assets"]}
bevy_ecs_ldtk = "*"
bevy_rapier2d = "*"
bevy-inspector-egui= "*"


# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 0

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3